{extend name="layout/saas" /}

{block name="content"}
<section class="password-workspace">
    <div class="surface-panel compact-form-panel password-panel">
        <div class="password-panel-head">
            <span class="password-panel-icon" aria-hidden="true"><i class="bi bi-shield-lock"></i></span>
            <div>
                <h2 class="password-panel-title">修改密码</h2>
                <p class="password-panel-desc">更新后将退出当前会话，需使用新密码重新登录。</p>
            </div>
        </div>
        <form method="post" action="/admin/account/password" data-admin-dirty-form>
            <input type="hidden" name="_token" value="{$csrfToken}">
            <div class="mb-3">
                <label class="form-label" for="current_password">当前密码</label>
                <input class="form-control" type="password" id="current_password" name="current_password" maxlength="72" required autocomplete="current-password">
            </div>
            <div class="mb-3">
                <label class="form-label" for="new_password">新密码</label>
                <input class="form-control" type="password" id="new_password" name="new_password" minlength="10" maxlength="72" required autocomplete="new-password">
                <div class="form-text">10 至 72 位，至少包含大小写字母、数字、特殊字符中的三类。</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="new_password_confirmation">确认新密码</label>
                <input class="form-control" type="password" id="new_password_confirmation" name="new_password_confirmation" minlength="10" maxlength="72" required autocomplete="new-password">
            </div>
            <button class="btn btn-dark w-100 password-submit" type="submit">
                <i class="bi bi-shield-check me-2" aria-hidden="true"></i>更新密码并重新登录
            </button>
        </form>
    </div>
</section>
{/block}
